spring.application.name=payrecon

spring.datasource.url=jdbc:postgresql://localhost:5434/payrecon_db
spring.datasource.username=payrecon_user
spring.datasource.password=payrecon_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
